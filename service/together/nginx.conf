limit_req_zone $binary_remote_addr zone=nen_together:1m rate=5r/s;
server {
    listen 80;
    server_name together.crygup.com;
    access_log off;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/letsencrypt; }
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name together.crygup.com;
    ssl_certificate /etc/letsencrypt/live/together.crygup.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/together.crygup.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    location / {
        limit_req zone=nen_together burst=20 nodelay;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        client_max_body_size 4k;
    }
}
