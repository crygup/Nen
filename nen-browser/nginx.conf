limit_req_zone $binary_remote_addr zone=nen_web_api:10m rate=10r/s;
server {
    listen 80;
    server_name nen.crygup.com;
    access_log off;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/letsencrypt; }
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name nen.crygup.com;
    ssl_certificate /etc/letsencrypt/live/nen.crygup.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nen.crygup.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    include /etc/nginx/snippets/nen-security-headers.conf;
    client_max_body_size 4k;
    limit_req_status 429;
    location = /nen-config { proxy_pass http://127.0.0.1:8091; }
    location = /win-download {
        proxy_pass http://127.0.0.1:8091;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }
    location ^~ /nen-mal/ {
        client_max_body_size 20k;
        limit_req zone=nen_web_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8091;
        proxy_read_timeout 90s;
    }
    location ^~ /nen-api/ {
        limit_req zone=nen_web_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8091;
        proxy_read_timeout 90s;
    }
    location = /nen-session {
        if ($http_origin != "https://nen.crygup.com") { return 403; }
        limit_req zone=nen_web_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8090/session;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Origin "";
        proxy_set_header Host together.crygup.com;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
    location ~ /\. { deny all; }
    location / { proxy_pass http://127.0.0.1:8091; }
}
