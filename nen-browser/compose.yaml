name: nen-web
services:
  api:
    build:
      context: ..
      dockerfile: nen-browser/Dockerfile
      args:
        NEN_COMMIT: ${NEN_COMMIT:-}
    restart: unless-stopped
    environment:
      NEN_DOWNLOAD_DIR: /app/downloads
      ANILIST_CLIENT_ID: "51898"
      mal_web_id: ${mal_web_id:-05d7e76a5113c1353dfeeb192e1a05e6}
      mal_web_secret: ${mal_web_secret:-}
    ports:
      - "127.0.0.1:8091:8091"
    volumes:
      - downloads:/app/downloads
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
    pids_limit: 64
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8091/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  downloads:
