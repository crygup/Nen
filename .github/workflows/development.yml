name: Development build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: development-windows
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run setup:media
      - shell: pwsh
        run: |
          $base = (Get-Content package.json | ConvertFrom-Json).version -replace "-.*$", ""
          npm version "$base-beta.$($env:GITHUB_SHA.Substring(0, 7))" --no-git-tag-version
      - run: npm run release
      - shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          @{ version = $version; commit = $env:GITHUB_SHA; installer = "Nen-Setup-$version.exe" } | ConvertTo-Json | Set-Content test-builds/development.json -Encoding utf8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nen-windows-x64
          path: |
            test-builds/Nen-Setup-*.exe
            test-builds/development.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
